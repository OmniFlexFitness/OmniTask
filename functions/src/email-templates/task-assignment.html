<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OmniTask</title>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#e4e4e7;margin:0;padding:20px;">
  <div style="max-width:600px;margin:0 auto;background:#16213e;border-radius:12px;padding:24px;">
    <h1 style="color:#8b5cf6;margin:0 0 8px 0;font-size:24px;">📋 New Task Assigned</h1>
    <p style="color:#94a3b8;font-size:14px;margin:0 0 20px;">In project: {{PROJECT_NAME}}</p>

    <div style="background:#1e293b;border-left:4px solid #8b5cf6;padding:16px;border-radius:8px;margin:16px 0;">
      <h2 style="color:#f1f5f9;margin:0;font-size:20px;">{{TASK_TITLE}}</h2>
      {{TASK_DESCRIPTION}}
    </div>

    <div style="margin:16px 0;">
      <span style="display:inline-block;background:#1e293b;padding:8px 12px;border-radius:6px;font-size:13px;margin-right:8px;">
        <span style="color:#64748b;">Priority:</span>
        <span style="color:#e2e8f0;">{{TASK_PRIORITY}}</span>
      </span>
      {{DUE_DATE_HTML}}
    </div>

    <a href="{{TASK_URL}}" style="display:inline-block;background:#8b5cf6;color:white;padding:12px 24px;border-radius:8px;text-decoration:none;margin-top:16px;font-weight:500;">
      View Task in OmniTask
    </a>

    <div style="color:#64748b;font-size:12px;margin-top:24px;border-top:1px solid #334155;padding-top:16px;">
      This email was sent by OmniTask because you were assigned a task.<br>
      OmniFlex Fitness Task Management
    </div>
  </div>
</body>
</html>
