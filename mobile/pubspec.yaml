name: omnitask_mobile
description: OmniTask mobile companion app (Flutter, iOS + Android).
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.6.0

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.4
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  firebase_app_check: ^0.3.1+5

  google_sign_in: ^6.2.2

  image_picker: ^1.1.2
  file_picker: ^8.1.4
  share_plus: ^10.1.2
  receive_sharing_intent: ^1.8.1
  flutter_local_notifications: ^18.0.1
  path_provider: ^2.1.5

  logger: ^2.5.0

  omniflex_design_system:
    path: packages/omniflex_design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
