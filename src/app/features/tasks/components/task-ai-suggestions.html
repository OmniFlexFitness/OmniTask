@if (type() === 'priority' || type() === 'dueDate') {
  <button
    type="button"
    (click)="onSuggest()"
    [disabled]="disabled() || loading()"
    class="text-[9px] text-purple-400 hover:text-purple-300 disabled:text-slate-600 disabled:cursor-not-allowed flex items-center gap-0.5 transition-colors"
    title="AI suggest {{ type() }}"
  >
    @if (loading()) {
      <svg
        class="animate-spin h-3 w-3"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    } @else {
      ✨ AI
    }
  </button>
} @else if (type() === 'subtasks') {
  <div>
    <div class="flex items-center justify-between mb-1">
      <label class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">Subtasks</label>
      <button
        type="button"
        (click)="onSuggest()"
        [disabled]="disabled() || loading()"
        class="text-[9px] text-purple-400 hover:text-purple-300 disabled:text-slate-600 disabled:cursor-not-allowed flex items-center gap-0.5 transition-colors"
        title="AI generate subtasks"
      >
        @if (loading()) {
          <svg
            class="animate-spin h-3 w-3"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Generating...
        } @else {
          ✨ Generate with AI
        }
      </button>
    </div>
    @if (subtasks().length > 0) {
      <div class="space-y-1.5 bg-slate-950/30 rounded-lg p-2 border border-purple-500/20">
        @for (subtask of subtasks(); track subtask.id; let i = $index) {
          <div class="flex items-center gap-2 text-sm text-slate-300">
            <span class="text-purple-400">✦</span>
            <span class="flex-1">{{ subtask.title }}</span>
            <button
              type="button"
              (click)="removeSubtask(i)"
              class="text-slate-500 hover:text-rose-400 transition-colors"
            >
              ×
            </button>
          </div>
        }
      </div>
    }
  </div>
}
