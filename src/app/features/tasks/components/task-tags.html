<div>
  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-widest mb-2"
    >Tags</label
  >

  <!-- Existing Project Tags -->
  @if (project()?.tags?.length) {
    <div class="flex flex-wrap gap-1.5 mb-2">
      @for (tag of project()?.tags; track tag.id) {
        <button
          type="button"
          data-fx-glitch
          (click)="toggleTag(tag.name)"
          [class.ring-2]="selectedTags().has(tag.name)"
          [style.--tw-ring-color]="
            selectedTags().has(tag.name) ? tag.color : 'transparent'
          "
          [style.background-color]="tag.color + '20'"
          [style.color]="tag.color"
          [style.border-color]="tag.color + '40'"
          class="px-2 py-0.5 rounded-full text-[11px] font-medium border transition-all hover:brightness-110"
        >
          {{ tag.name }}
        </button>
      }
    </div>
  }

  <!-- Add New Tag -->
  <div class="flex gap-2">
    <input
      type="text"
      #tagInput
      (keydown.enter)="
        $event.preventDefault(); addTag(tagInput.value); tagInput.value = ''
      "
      placeholder="Add new tag..."
      class="flex-1 bg-transparent border border-white/10 rounded-lg px-3 py-1.5 text-sm text-slate-300 placeholder-slate-500 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors"
    />
    <button
      type="button"
      data-fx-glitch
      (click)="addTag(tagInput.value); tagInput.value = ''"
      class="px-2.5 py-1.5 text-sm bg-slate-800 text-slate-300 rounded-lg hover:bg-slate-700 transition-colors"
    >
      Add
    </button>
  </div>

  <!-- Selected Tags Display (Ctrl/Shift/⌘-click a chip to remove it) -->
  @if (selectedTags().size > 0) {
    <div class="mt-2">
      <div class="flex flex-wrap gap-1.5">
        @for (tagName of selectedTagsArray(); track tagName) {
          <button
            type="button"
            class="ofx-tag-chip inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium border transition-all cursor-pointer"
            [style.background-color]="getTagColor(tagName) + '20'"
            [style.color]="getTagColor(tagName)"
            [style.border-color]="getTagColor(tagName) + '40'"
            (click)="onSelectedTagClick(tagName, $event)"
            [title]="'Ctrl/Shift + click to remove'"
          >
            {{ tagName }}
          </button>
        }
      </div>
      <p class="mt-1.5 text-[10px] text-slate-500 italic">
        Hold <kbd class="px-1 py-0.5 rounded bg-slate-800 text-slate-400 text-[9px]">Ctrl</kbd>
        or <kbd class="px-1 py-0.5 rounded bg-slate-800 text-slate-400 text-[9px]">Shift</kbd>
        and click a tag to remove it.
      </p>
    </div>
  }
</div>
