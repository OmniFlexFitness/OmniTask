<div class="w-full space-y-4">
  <!-- Filters -->
  <div class="flex items-center gap-2 flex-wrap">
    <div class="flex items-center gap-1 p-1 rounded-lg border border-white/5 bg-slate-950/60">
      <button class="mytasks-filter" [class.active]="statusFilter() === 'open'" (click)="setFilter('open')">
        Open
      </button>
      <button class="mytasks-filter" [class.active]="statusFilter() === 'todo'" (click)="setFilter('todo')">
        To Do
      </button>
      <button class="mytasks-filter" [class.active]="statusFilter() === 'in-progress'" (click)="setFilter('in-progress')">
        In Progress
      </button>
      <button class="mytasks-filter" [class.active]="statusFilter() === 'done'" (click)="setFilter('done')">
        Done
      </button>
      <button class="mytasks-filter" [class.active]="statusFilter() === 'all'" (click)="setFilter('all')">
        All
      </button>
    </div>
    <input
      type="search"
      placeholder="Filter…"
      [value]="search()"
      (input)="onSearch($any($event.target).value)"
      class="px-3 py-1.5 rounded-lg bg-slate-950/60 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500/60 flex-1 max-w-xs"
    />
    <span class="text-[11px] text-slate-500 font-mono">
      {{ filteredTasks().length }} / {{ tasks().length }}
    </span>
  </div>

  <!-- Groups -->
  @if (!groupedTasks().length) {
    <div class="ofx-panel p-8 text-center">
      <p class="text-slate-400 text-sm">Nothing matches the current filter.</p>
      <button class="mt-3 omni-glitch-btn ofx-ghost-button text-xs" (click)="createTaskInProject.emit(null)">
        + Add a personal task
      </button>
    </div>
  } @else {
    <div
      cdkDropList
      [cdkDropListData]="groupedTasks()"
      (cdkDropListDropped)="onGroupDrop($event)"
      class="space-y-4"
    >
    @for (g of groupedTasks(); track g.projectId) {
      <section cdkDrag [cdkDragData]="g" class="ofx-panel p-4 mytasks-group">
        <div
          *cdkDragPlaceholder
          class="ofx-panel p-4 border border-dashed border-violet-500/40 bg-violet-500/5 h-24"
        ></div>
        <header
          cdkDragHandle
          class="flex items-center justify-between gap-2 mb-3 flex-wrap cursor-grab active:cursor-grabbing select-none"
          title="Drag to reorder"
        >
          <div class="flex items-center gap-2 min-w-0">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-3.5 w-3.5 text-slate-500 flex-shrink-0"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <span
              class="w-2.5 h-2.5 rounded-sm flex-shrink-0"
              [style.background]="g.projectColor"
              [style.box-shadow]="'0 0 8px ' + g.projectColor"
            ></span>
            <h4 class="text-sm font-bold text-slate-100 truncate">{{ g.projectName }}</h4>
            <span class="text-[11px] text-slate-500 font-mono">· {{ g.tasks.length }}</span>
          </div>
          <button
            class="text-[11px] text-violet-400 hover:text-violet-300"
            (click)="createTaskInProject.emit(g.projectId); $event.stopPropagation()"
          >
            + Task
          </button>
        </header>

        <ul class="space-y-1.5">
          @for (task of g.tasks; track task.id) {
            <li>
              <div class="mytasks-row">
                <!-- Complete toggle -->
                <button
                  class="mytasks-complete"
                  [class.done]="task.status === 'done'"
                  [title]="task.status === 'done' ? 'Reopen task' : 'Mark as done'"
                  (click)="toggleComplete.emit(task)"
                >
                  @if (task.status === 'done') {
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                  }
                </button>

                <!-- Priority dot -->
                <span class="mytasks-priority-dot" [style.background]="priorityColor(task.priority)"></span>

                <!-- Title + caption -->
                <button class="mytasks-title-btn" (click)="taskClick.emit(task)">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="truncate text-sm" [class.line-through]="task.status === 'done'" [class.text-slate-500]="task.status === 'done'" [class.text-slate-100]="task.status !== 'done'">
                      {{ task.title }}
                    </span>
                    @if (isCreatorOnly(task)) {
                      <span class="ofx-chip text-[9px] bg-violet-500/10 text-violet-300 border border-violet-500/30">
                        Created
                      </span>
                    }
                  </div>
                  <div class="text-[10px] text-slate-500 mt-0.5 flex flex-wrap items-center gap-x-2 gap-y-0.5">
                    <span class="inline-flex items-center gap-1">
                      <span class="w-1.5 h-1.5 rounded-full" [style.background]="statusColor(task.status)"></span>
                      {{ statusLabel(task.status) }}
                    </span>
                    @if (task.dueDate) {
                      @let d = asDate(task.dueDate);
                      @if (d) {
                        <span [class.text-rose-400]="isOverdue(task)">Due {{ d | date: 'MMM d' }}</span>
                      }
                    }
                    @if (task.tags && task.tags.length) {
                      <span class="text-slate-500">#{{ task.tags[0] }}{{ task.tags.length > 1 ? ' +' + (task.tags.length - 1) : '' }}</span>
                    }
                  </div>
                </button>
              </div>
            </li>
          }
        </ul>
      </section>
    }
    </div>
  }
</div>
