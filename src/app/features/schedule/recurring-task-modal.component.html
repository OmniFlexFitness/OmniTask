<!-- Backdrop -->
    <div
      class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
      (click)="onBackdropClick($event)"
    >
      <!-- Modal -->
      <div
        class="bg-[#0f1419] border border-white/10 rounded-2xl w-full max-w-md shadow-2xl shadow-purple-500/10"
        (click)="$event.stopPropagation()"
      >
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-white/10">
          <h2 class="text-lg font-bold text-white font-['Orbitron',sans-serif]">
            {{ editTask() ? 'Edit' : 'New' }} Daily Task
          </h2>
          <button
            class="p-1 text-slate-400 hover:text-white transition-colors"
            (click)="close.emit()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>

        <!-- Body -->
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-5">
          <!-- Title -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider"
              >Title</label
            >
            <input
              formControlName="title"
              class="w-full bg-slate-800/60 border border-white/10 rounded-lg px-3 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500/50 transition-all"
              placeholder="e.g. Morning standup"
            />
          </div>

          <!-- Time -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider"
              >Time</label
            >
            <input
              type="time"
              formControlName="time"
              class="w-full bg-slate-800/60 border border-white/10 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500/50 transition-all [color-scheme:dark]"
            />
          </div>

          <!-- Description -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider"
              >Description (optional)</label
            >
            <textarea
              formControlName="description"
              rows="2"
              class="w-full bg-slate-800/60 border border-white/10 rounded-lg px-3 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500/50 transition-all resize-none"
              placeholder="Notes for this daily task..."
            ></textarea>
          </div>

          <!-- Color -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider"
              >Color</label
            >
            <div class="flex gap-2 flex-wrap">
              @for (color of colors; track color) {
                <button
                  type="button"
                  class="w-8 h-8 rounded-full border-2 transition-all hover:scale-110"
                  [style.background-color]="color"
                  [class.border-white]="form.get('color')?.value === color"
                  [class.border-transparent]="form.get('color')?.value !== color"
                  [class.ring-2]="form.get('color')?.value === color"
                  [class.ring-white/30]="form.get('color')?.value === color"
                  (click)="form.patchValue({ color })"
                ></button>
              }
            </div>
          </div>

          <!-- Reminders -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider"
              >Reminders</label
            >
            <div class="space-y-2">
              @for (reminder of availableReminders; track reminder.value) {
                <label
                  class="flex items-center gap-3 p-2.5 rounded-lg border cursor-pointer transition-all hover:bg-white/5"
                  [class.bg-purple-900/20]="hasReminder(reminder.value)"
                  [class.border-purple-500/50]="hasReminder(reminder.value)"
                  [class.bg-slate-800/40]="!hasReminder(reminder.value)"
                  [class.border-white/5]="!hasReminder(reminder.value)"
                >
                  <div class="relative flex items-center justify-center">
                    <input
                      type="checkbox"
                      class="peer sr-only"
                      [checked]="hasReminder(reminder.value)"
                      (change)="toggleReminder(reminder.value)"
                    />
                    <div
                      class="w-5 h-5 rounded border border-slate-500 peer-checked:bg-purple-500 peer-checked:border-purple-500 transition-colors flex items-center justify-center"
                    >
                      <svg
                        class="w-3.5 h-3.5 text-white opacity-0 peer-checked:opacity-100 transition-opacity"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="3"
                      >
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                      </svg>
                    </div>
                  </div>
                  <span
                    class="text-sm select-none"
                    [class.text-white]="hasReminder(reminder.value)"
                    [class.text-slate-300]="!hasReminder(reminder.value)"
                  >
                    {{ reminder.label }}
                  </span>
                </label>
              }
            </div>
          </div>

          <!-- Enabled toggle -->
          <div class="flex items-center justify-between">
            <span class="text-sm text-slate-300">Enabled</span>
            <button
              type="button"
              class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
              [class.bg-purple-600]="form.get('enabled')?.value"
              [class.bg-slate-700]="!form.get('enabled')?.value"
              (click)="form.patchValue({ enabled: !form.get('enabled')?.value })"
            >
              <span
                class="inline-block h-4 w-4 rounded-full bg-white shadow transition-transform"
                [class.translate-x-6]="form.get('enabled')?.value"
                [class.translate-x-1]="!form.get('enabled')?.value"
              ></span>
            </button>
          </div>

          <!-- Actions -->
          <div class="flex justify-between items-center pt-2">
            <div>
              @if (editTask()) {
                <button
                  type="button"
                  class="px-4 py-2 text-sm text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 rounded-lg transition-colors"
                  (click)="onDelete()"
                >
                  Delete
                </button>
              }
            </div>
            <div class="flex gap-3">
              <button
                type="button"
                class="px-4 py-2 text-sm text-slate-400 hover:text-white hover:bg-white/5 rounded-lg transition-colors"
                (click)="close.emit()"
              >
                Cancel
              </button>
              <button
                type="submit"
                [disabled]="form.invalid || scheduleService.loading()"
                class="px-5 py-2 text-sm font-semibold rounded-lg transition-all disabled:opacity-40 disabled:cursor-not-allowed bg-purple-600 hover:bg-purple-500 text-white shadow-lg shadow-purple-500/20 hover:shadow-purple-500/40"
              >
                {{ editTask() ? 'Save' : 'Create' }}
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
