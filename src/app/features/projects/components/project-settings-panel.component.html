<div class="space-y-8">
  <!-- Basic Info Section -->
  <app-project-basic-info
    [project]="project()"
    (projectChanged)="projectChanged.emit()"
  ></app-project-basic-info>

  <hr class="border-white/10" />

  <!-- Sections Management -->
  <section class="ofx-settings-section">
    <app-section-manager
      [projectId]="project().id"
      [sections]="project().sections || []"
      (sectionsChanged)="projectChanged.emit()"
    ></app-section-manager>
  </section>

  <hr class="border-white/10" />

  <!-- Tags Management -->
  <section class="ofx-settings-section">
    <app-tag-manager
      [projectId]="project().id"
      [tags]="project().tags || []"
      (tagsChanged)="projectChanged.emit()"
    ></app-tag-manager>
  </section>

  <hr class="border-white/10" />

  <!-- Task Point Values -->
  <section class="ofx-settings-section">
    <app-point-scale-manager
      [project]="project()"
      (projectChanged)="projectChanged.emit()"
    ></app-point-scale-manager>
  </section>

  <hr class="border-white/10" />

  <!-- Automation -->
  <section class="ofx-settings-section">
    <app-project-automation-panel
      [project]="project()"
      (projectChanged)="projectChanged.emit()"
    ></app-project-automation-panel>
  </section>

  <hr class="border-white/10" />

  <!-- Custom Fields -->
  <section class="ofx-settings-section">
    <h3 class="text-sm font-semibold text-slate-200 mb-4">Custom Fields</h3>
    <app-custom-field-manager [project]="project()"></app-custom-field-manager>
  </section>

  <hr class="border-white/10" />

  <!-- Members Section -->
  <section class="ofx-settings-section">
    <h3 class="ofx-section-title">Team Members</h3>
    <div class="mt-4">
      <app-project-member-manager [project]="project()"></app-project-member-manager>
    </div>
  </section>

  <hr class="border-white/10" />

  <!-- Google Tasks Integration -->
  <app-project-google-tasks-sync [project]="project()" (projectChanged)="projectChanged.emit()">
  </app-project-google-tasks-sync>

  <hr class="border-white/10" />

  <!-- Google Sheets Integration -->
  <app-project-google-sheets-sync [project]="project()" (projectChanged)="projectChanged.emit()">
  </app-project-google-sheets-sync>

  <hr class="border-white/10" />

  <!-- Export -->
  <section class="ofx-settings-section">
    <h3 class="ofx-section-title">Export</h3>
    <p class="mt-1 text-xs text-slate-400">
      Download a snapshot of this project's tasks for backup or migration.
    </p>
    <div class="mt-4 flex flex-wrap gap-2">
      <button
        type="button"
        class="omni-glitch-btn px-3 py-1.5 rounded-lg border border-cyan-500/40 bg-cyan-500/10 text-cyan-200 text-xs font-semibold hover:bg-cyan-500/20 transition-all"
        (click)="exportTasksCsv()"
      >
        Export CSV
      </button>
      <button
        type="button"
        class="omni-glitch-btn px-3 py-1.5 rounded-lg border border-violet-500/40 bg-violet-500/10 text-violet-200 text-xs font-semibold hover:bg-violet-500/20 transition-all"
        (click)="exportTasksJson()"
      >
        Export JSON
      </button>
    </div>
  </section>

  <hr class="border-white/10" />

  <!-- Danger Zone -->
  <app-project-danger-zone
    [project]="project()"
    (projectChanged)="projectChanged.emit()"
    (projectDeleted)="projectDeleted.emit()"
  ></app-project-danger-zone>
</div>
