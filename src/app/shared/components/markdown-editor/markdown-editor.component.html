    <div class="md-editor" [class.md-editor-minimal]="minimal()">
      <!-- Toolbar — always visible -->
      <div class="md-toolbar" [class.md-toolbar-minimal]="minimal()">
        <!-- Undo -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          [class.md-btn-disabled]="!canUndo()"
          title="Undo (Ctrl+Z)"
          (click)="undo()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="md-svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 10h10a5 5 0 015 5v2M3 10l4-4M3 10l4 4"
            />
          </svg>
        </button>

        <!-- Redo -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          [class.md-btn-disabled]="!canRedo()"
          title="Redo (Ctrl+Y)"
          (click)="redo()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="md-svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 10H11a5 5 0 00-5 5v2M21 10l-4-4M21 10l-4 4"
            />
          </svg>
        </button>

        <span class="md-divider"></span>

        <!-- Bold -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Bold (Ctrl+B)"
          (click)="wrapSelection('**', '**')"
        >
          <span class="md-icon-bold">B</span>
        </button>

        <!-- Italic -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Italic (Ctrl+I)"
          (click)="wrapSelection('*', '*')"
        >
          <span class="md-icon-italic">I</span>
        </button>

        <!-- Strikethrough -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Strikethrough"
          (click)="wrapSelection('~~', '~~')"
        >
          <span class="md-icon-strike">S</span>
        </button>

        <!-- Highlight -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Highlight"
          (click)="wrapSelection('==', '==')"
        >
          <span class="md-icon-highlight">H</span>
        </button>

        <span class="md-divider"></span>

        <!-- Heading -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Heading"
          (click)="insertPrefix('## ')"
        >
          <span class="md-icon-bold" style="font-size:10px">H2</span>
        </button>

        <!-- Blockquote -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Blockquote"
          (click)="insertPrefix('> ')"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="md-svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
            />
          </svg>
        </button>

        <span class="md-divider"></span>

        <!-- Bulleted list -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Bulleted list"
          (click)="insertPrefix('- ')"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="md-svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>

        <!-- Numbered list -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Numbered list"
          (click)="insertPrefix('1. ')"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="md-svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M7 8h10M7 12h10M7 16h10M3 8h.01M3 12h.01M3 16h.01"
            />
          </svg>
        </button>

        <!-- Task list -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Task list"
          (click)="insertPrefix('- [ ] ')"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="md-svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
            />
          </svg>
        </button>

        <span class="md-divider"></span>

        <!-- Code inline -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Inline code (Ctrl+E)"
          (click)="wrapSelection('\`', '\`')"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="md-svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
            />
          </svg>
        </button>

        <!-- Code block -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Code block"
          (click)="insertCodeBlock()"
        >
          <span class="md-icon-mono">{{ codeBlockLabel }}</span>
        </button>

        <!-- Link -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Link (Ctrl+K)"
          (click)="insertLink()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="md-svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"
            />
          </svg>
        </button>

        <!-- Table -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Insert table"
          (click)="insertTable()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="md-svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 10h18M3 14h18M10 3v18M14 3v18M3 6a3 3 0 013-3h12a3 3 0 013 3v12a3 3 0 01-3 3H6a3 3 0 01-3-3V6z"
            />
          </svg>
        </button>

        <!-- Horizontal rule -->
        <button
          type="button"
          tabindex="-1"
          class="md-btn"
          title="Horizontal rule"
          (click)="insertHorizontalRule()"
        >
          <span class="md-icon-hr">—</span>
        </button>

        @if (!minimal()) {
          <!-- Callout (full mode only to save space) -->
          <button
            type="button"
            tabindex="-1"
            class="md-btn"
            title="Callout"
            (click)="insertCallout()"
          >
            <span class="md-icon-callout">📝</span>
          </button>
        }
      </div>

      <!-- Textarea (always visible) -->
      <textarea
        #textareaRef
        [rows]="rows()"
        [placeholder]="placeholder()"
        [ngModel]="value()"
        (ngModelChange)="onValueChange($event)"
        (blur)="blurred.emit()"
        (keydown)="onKeydown($event)"
        class="md-textarea"
        [class.md-textarea-minimal]="minimal()"
      ></textarea>

      <!-- Live Preview (shown when there is content) -->
      @if (hasContent()) {
        <div
          class="md-live-preview"
          [class.md-live-preview-minimal]="minimal()"
          [innerHTML]="value() | markdown"
        ></div>
      }
    </div>
  `,
