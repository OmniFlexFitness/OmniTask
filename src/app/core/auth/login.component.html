<div class="login-page">
  <!-- Background Layer -->
  <div class="login-bg">
    <img
      src="assets/img/27250823_abstract_pixel_design_banner_3112.jpg"
      alt=""
    />
    <div class="login-bg-tint"></div>
    <div class="login-bg-grid"></div>
  </div>

  <!-- Scanline effect -->
  <div class="cyber-scanlines"></div>

  <!-- Centered Content Area -->
  <div class="login-center">
    <div class="login-columns">
      <!-- Left: Brand -->
      <div class="brand-col">
        <div class="brand-logo-row">
          <img
            src="assets/images/logo.png"
            alt="OmniFlex Logo"
            class="brand-logo"
          />
          <div class="brand-text">
            <div class="status-badge">
              <span class="dot-wrap">
                <span class="dot-ping"></span>
                <span class="dot-solid"></span>
              </span>
              <span class="status-label">System Online</span>
            </div>
            <h1 class="brand-title">
              <span class="t-white">OMNI</span><span class="t-gradient">TASK</span>
            </h1>
          </div>
        </div>
        <p class="brand-desc">
          OmniTask manages projects and tasks for the
          <span class="brand-hl">OmniFlex team</span>.
          <br /><span class="brand-sub">Sign in to continue.</span>
        </p>
        <div class="terminal-line" aria-hidden="true">
          <span class="term-gt">&gt;</span>
          <span class="term-txt">AWAITING_AUTHENTICATION</span>
          <span class="term-cursor"></span>
        </div>
      </div>

      <!-- Right: Auth Card -->
      <div class="card-col">
        <div class="card-outer">
          <div class="card-glow"></div>
          <div class="bracket tl"></div>
          <div class="bracket tr"></div>
          <div class="bracket bl"></div>
          <div class="bracket br"></div>
          <div class="card-inner">
            <div class="card-accent-line"></div>
            <div class="card-head">
              <h2>Sign in</h2>
              <div class="card-bar"></div>
            </div>
            <button (click)="login()" class="auth-btn google-sign-in-btn" type="button">
              <span class="btn-label">
                <svg class="google-g" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
              </span>
            </button>
            <div class="card-foot">
              <span class="foot-item">
                <svg fill="currentColor" viewBox="0 0 20 20">
                  <path
                    fill-rule="evenodd"
                    d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                    clip-rule="evenodd"
                  />
                </svg>
                Secure Connection
              </span>
              <span class="foot-item">
                <span class="enc-dot"></span>
                Encrypted
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="login-foot">
    OmniFlex Fitness · OmniTask v{{ version() }}
  </div>
</div>
