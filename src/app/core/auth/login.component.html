<div class="login-page">
  <!-- Background Layer -->
  <div class="login-bg">
    <img
      src="assets/img/27250823_abstract_pixel_design_banner_3112.jpg"
      alt=""
    />
    <div class="login-bg-tint"></div>
    <div class="login-bg-grid"></div>
  </div>

  <!-- Scanline effect -->
  <div class="cyber-scanlines"></div>

  <!-- Centered Content Area -->
  <div class="login-center">
    <div class="login-columns">
      <!-- Left: Brand -->
      <div class="brand-col">
        <div class="brand-logo-row">
          <img
            src="assets/images/logo.png"
            alt="OmniFlex Logo"
            class="brand-logo"
          />
          <div class="brand-text">
            <div class="status-badge">
              <span class="dot-wrap">
                <span class="dot-ping"></span>
                <span class="dot-solid"></span>
              </span>
              <span class="status-label">System Online</span>
            </div>
            <h1 class="brand-title">
              <span class="t-white">OMNI</span><span class="t-gradient">TASK</span>
            </h1>
          </div>
        </div>
        <p class="brand-desc">
          The next-generation project orchestration node for the
          <span class="brand-hl">OmniFlex Ecosystem</span>.
          <br /><span class="brand-sub">Initialize your workspace.</span>
        </p>
        <div class="terminal-line">
          <span class="term-gt">&gt;</span>
          <span class="term-txt">AWAITING_AUTHENTICATION</span>
          <span class="term-cursor"></span>
        </div>
      </div>

      <!-- Right: Auth Card -->
      <div class="card-col">
        <div class="card-outer">
          <div class="card-glow"></div>
          <div class="bracket tl"></div>
          <div class="bracket tr"></div>
          <div class="bracket bl"></div>
          <div class="bracket br"></div>
          <div class="card-inner">
            <div class="card-accent-line"></div>
            <div class="card-head">
              <h2 data-scramble>Identity Verification</h2>
              <div class="card-bar"></div>
            </div>
            <button (click)="login()" class="omni-glitch-btn auth-btn" type="button">
              <span class="btn-shine"></span>
              <span class="btn-label">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"
                  />
                </svg>
                Authenticate with Google
              </span>
            </button>
            <div class="card-foot">
              <span class="foot-item">
                <svg fill="currentColor" viewBox="0 0 20 20">
                  <path
                    fill-rule="evenodd"
                    d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                    clip-rule="evenodd"
                  />
                </svg>
                Secure Connection
              </span>
              <span class="foot-item">
                <span class="enc-dot"></span>
                Encrypted
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="login-foot">
    <span class="fc">//</span> OmniFlex Corporation
    <span class="fp">//</span> Authorized Personnel Only
    <span class="fc">//</span>
  </div>
</div>
