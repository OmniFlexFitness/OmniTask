name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main, live]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true
      - run: flutter pub get
      # Skip if android/ has not been generated yet (Phase 0 scaffolding only).
      - name: Build APK
        run: |
          if [ -d android ]; then
            flutter build apk --debug
          else
            echo "android/ not yet generated — skipping APK build"
          fi

  ios-build:
    name: iOS debug build
    # macOS minutes are paid; only run on main/live to conserve them.
    if: github.event_name == 'push'
    runs-on: macos-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (no codesign)
        run: |
          if [ -d ios ]; then
            flutter build ios --debug --no-codesign
          else
            echo "ios/ not yet generated — skipping iOS build"
          fi
