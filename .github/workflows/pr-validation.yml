name: PR Validation

on:
  pull_request:
    branches:
      - live
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: "22"
  # Secrets cannot be referenced in `if:` directly; mirror presence into env.
  # Prefer a dedicated, low-limit CI key (ANTHROPIC_API_KEY_CI) so the key that
  # runs on PR-authored code is not the one the deploy seeds into production;
  # fall back to ANTHROPIC_API_KEY so the smoke test still runs without it.
  HAS_ANTHROPIC_KEY: ${{ (secrets.ANTHROPIC_API_KEY_CI || secrets.ANTHROPIC_API_KEY) != '' }}

jobs:
  validate:
    name: Validate PR Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      # ============================================
      # Angular App Validation
      # ============================================
      - name: Install app dependencies
        run: yarn install --frozen-lockfile

      - name: Lint check
        run: yarn lint

      - name: Build Angular app
        run: yarn build

      - name: Run tests
        run: yarn test --no-watch --no-progress --browsers=ChromeHeadless

      # ============================================
      # Firebase Functions Validation
      # ============================================
      - name: Validate Functions lock file sync
        run: |
          echo "Checking functions/package-lock.json is in sync with functions/package.json..."
          cd functions
          npm ci
          echo "✅ Functions lock file is in sync"

      - name: Build Firebase Functions
        run: |
          cd functions
          npm run build

      - name: Run Firebase Functions unit tests
        run: |
          cd functions
          npm test

      # One real Claude request through functions/src/ai/claude.ts. Verifies
      # the model ID and request parameters against the live API, which the
      # emulator and unit tests cannot. Skipped when no secret is present
      # (e.g. PRs from forks). Uses ANTHROPIC_API_KEY_CI when set (see env above).
      - name: Claude AI smoke test
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI || secrets.ANTHROPIC_API_KEY }}
        run: |
          cd functions
          node scripts/ai-smoke.mjs

      # ============================================
      # Docker Build Validation
      # ============================================
      - name: Validate Docker build
        run: |
          echo "Validating Docker build..."
          docker build -t omnitask-pr-test:${{ github.sha }} .
          echo "✅ Docker build successful"

      - name: Validation Summary
        run: |
          echo "============================================"
          echo "✅ All validations passed!"
          echo "============================================"
          echo ""
          echo "Validated:"
          echo "  - Angular app build"
          echo "  - Firebase Functions dependencies sync"
          echo "  - Firebase Functions TypeScript build"  
          echo "  - Docker image build"
          echo ""
          echo "This PR is safe to merge to the live branch."
