name: Deploy to Cloud Run & Firebase

on:
  push:
    branches:
      - live

concurrency:
  group: deploy-live
  cancel-in-progress: false

env:
  # Note: GCP_PROJECT_ID must be set in repository secrets
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east1
  SERVICE_NAME: omnitask
  ARTIFACT_REGISTRY: us-east1-docker.pkg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}


      - name: Get version
        id: version
        run: |
          # Refresh tags from origin so concurrent or re-run deploys don't
          # collide on a tag that already exists remotely.
          git fetch --tags --force origin
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.00"
          fi
          MAJOR=$(echo $LATEST_TAG | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo $LATEST_TAG | cut -d. -f2)
          PATCH=$(echo $LATEST_TAG | cut -d. -f3)
          # Increment patch until we find a tag that doesn't exist locally or
          # on the remote. Guards against re-runs landing on an existing tag.
          NEW_PATCH=$((10#$PATCH + 1))
          while : ; do
            FORMATTED_PATCH=$(printf "%02d" $NEW_PATCH)
            CANDIDATE="v${MAJOR}.${MINOR}.${FORMATTED_PATCH}"
            if git rev-parse -q --verify "refs/tags/${CANDIDATE}" >/dev/null \
               || git ls-remote --exit-code --tags origin "refs/tags/${CANDIDATE}" >/dev/null 2>&1; then
              NEW_PATCH=$((NEW_PATCH + 1))
              continue
            fi
            break
          done
          NEW_VERSION="$CANDIDATE"
          DISPLAY_VERSION="${MAJOR}.${MINOR}.${FORMATTED_PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION (Display: $DISPLAY_VERSION)"

      - name: Generate version file
        run: |
          mkdir -p public
          echo "{\"version\":\"${{ steps.version.outputs.display_version }}\"}" > public/version.json
          cat public/version.json

      - name: Build Docker image
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/omnitask/${{ env.SERVICE_NAME }}:${{ steps.version.outputs.version }} .
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/omnitask/${{ env.SERVICE_NAME }}:latest .

      - name: Push Docker image
        run: |
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/omnitask/${{ env.SERVICE_NAME }}:${{ steps.version.outputs.version }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/omnitask/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/omnitask/${{ env.SERVICE_NAME }}:${{ steps.version.outputs.version }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080

      # Firebase Deployment Steps

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Build Angular app
        run: yarn build

      - name: Install Firebase Functions dependencies
        run: |
          cd functions
          npm ci
          cd ..

      - name: Enable Required APIs for Firebase Extensions
        run: gcloud services enable firebaseinstallations.googleapis.com aiplatform.googleapis.com --project ${{ env.PROJECT_ID }}

      - name: Ensure Functions secrets exist
        # The GitHub Issues integration functions bind these secrets via
        # defineSecret(). `firebase deploy --non-interactive` aborts the whole
        # deploy if any bound secret is missing in Secret Manager
        # ("have no value for the secret: GITHUB_APP_ID"), which blocks every
        # push to live. Create an empty placeholder for any that don't exist
        # yet so the deploy proceeds. Set real values later (without code
        # changes) via: firebase functions:secrets:set <NAME> --project <id>.
        # Existing secrets are never overwritten — the describe check skips them.
        run: |
          for SECRET in \
            GITHUB_APP_ID \
            GITHUB_APP_PRIVATE_KEY \
            GITHUB_CLIENT_ID \
            GITHUB_CLIENT_SECRET \
            GITHUB_WEBHOOK_SECRET; do
            if gcloud secrets describe "$SECRET" --project "${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
              echo "Secret $SECRET already exists; leaving it untouched."
            else
              echo "Creating placeholder for missing secret: $SECRET"
              printf 'placeholder' | gcloud secrets create "$SECRET" \
                --data-file=- \
                --replication-policy=automatic \
                --project "${{ env.PROJECT_ID }}"
            fi
          done

      - name: Deploy to Firebase (Hosting, Firestore, Functions)
        # Creating ~28 gen2 functions at once intermittently trips Cloud Run
        # container startup healthchecks ("failed to start and listen on
        # PORT=8080 within timeout") on a shifting subset of functions. Firebase
        # skips unchanged functions on a re-run, so a retry re-attempts only the
        # ones that didn't land — with far less concurrent cold-start load —
        # which converges to a clean deploy. Retry up to 4 times with backoff.
        run: |
          set +e
          attempts=4
          for i in $(seq 1 $attempts); do
            echo "::group::Firebase deploy attempt $i/$attempts"
            npx firebase-tools deploy --only hosting,firestore,functions \
              --project ${{ env.PROJECT_ID }} --non-interactive --force
            code=$?
            echo "::endgroup::"
            if [ $code -eq 0 ]; then
              echo "Firebase deploy succeeded on attempt $i."
              exit 0
            fi
            if [ $i -lt $attempts ]; then
              echo "Attempt $i failed (exit $code). Retrying in 30s..."
              sleep 30
            fi
          done
          echo "Firebase deploy failed after $attempts attempts." >&2
          exit 1

      - name: Create Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.version }}"
          # If the tag was created out-of-band between the version step and now
          # (e.g. another pipeline run), skip rather than fail the deploy.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping tag push."
            exit 0
          fi
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Output deployment URLs
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "🚀 Cloud Run: $URL"
          echo "🔥 Firebase Hosting: https://omnitask-475422.web.app"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
